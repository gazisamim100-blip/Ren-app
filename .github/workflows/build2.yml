name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova & Build App
        run: |
          npm install -g cordova
          cordova create ren-app com.nova.ren RenApp
          cd ren-app
          cordova platform add android
          mv ../index.html www/index.html
          cordova build android --debug

      - name: Upload Clean APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ren-Asli-APK
          path: ren-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
